name: Fix Niadd Synthetiq pages

on:
  push:
    paths:
      - ".github/workflows/fix-niadd-synthetiq-pages.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Patch Niadd multi-page chapter support
        run: python3 .github/scripts/fix_niadd_synthetiq.py

      - name: Validate JavaScript
        run: node --check modules/niadd-ptbr/index.js

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/niadd-ptbr/index.js
          git commit -m "Fix Niadd Synthetiq chapter pagination"
          git push
