name: Fix Niadd Synthetiq pages

on:
  push:
    paths:
      - ".github/workflows/fix-niadd-synthetiq-pages.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Patch Niadd multi-page chapter support
        shell: bash
        run: |
          python3 .github/scripts/fix_niadd_synthetiq.py || grep -q "function subPageURLsFromHTML" modules/niadd-ptbr/index.js

      - name: Validate JavaScript
        run: node --check modules/niadd-ptbr/index.js

      - name: Update Synthetiq hashes and version
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          manifest_path = Path("modules/niadd-ptbr/manifest.json")
          index_path = Path("index.json")
          entry_path = Path("modules/niadd-ptbr/index.js")

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          old_hash = manifest["entry"].get("sha256", "")
          new_hash = sha256(entry_path)

          if old_hash != new_hash:
              parts = str(manifest.get("version", "1.0.0")).split(".")
              while len(parts) < 3:
                  parts.append("0")
              parts[2] = str(int(parts[2]) + 1)
              manifest["version"] = ".".join(parts[:3])

          manifest["entry"]["sha256"] = new_hash
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          index = json.loads(index_path.read_text(encoding="utf-8"))
          for module in index.get("modules", []):
              if module.get("id") == "niadd-ptbr-v1":
                  module["version"] = manifest["version"]
                  module["manifest"]["sha256"] = sha256(manifest_path)
                  break
          else:
              raise SystemExit("Niadd module not found in index.json")

          index["generatedAt"] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          index_path.write_text(json.dumps(index, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Niadd is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/niadd-ptbr/index.js modules/niadd-ptbr/manifest.json index.json
          git commit -m "Finalize Niadd Synthetiq pagination fix"
          git push
