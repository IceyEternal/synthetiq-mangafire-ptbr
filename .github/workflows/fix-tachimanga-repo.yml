name: Fix Tachimanga repository metadata

on:
  push:
    paths:
      - ".github/workflows/fix-tachimanga-repo.yml"
      - "tachimanga/*.jar"
      - "tachimanga/index.json"
      - "tachimanga/index.min.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Tachimanga repository layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tachimanga/apk tachimanga/icon

          for jar in tachimanga/*-Tachimanga.jar; do
            [ -f "$jar" ] || continue
            cp -f "$jar" "tachimanga/apk/$(basename "$jar")"
          done

          fingerprint="$(keytool -printcert -jarfile tachimanga/MangaFire-PT-BR-Tachimanga.jar | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$fingerprint" ]; then
            echo "Could not extract JAR signing fingerprint"
            exit 1
          fi
          echo "Signing fingerprint: $fingerprint"

          python3 - "$fingerprint" <<'PY'
          import json
          import sys
          from pathlib import Path

          fingerprint = sys.argv[1]
          out = Path("tachimanga")

          repo = {
              "meta": {
                  "name": "Manga PT-BR Sources",
                  "shortName": "PT-BR",
                  "website": "https://github.com/IceyEternal/synthetiq-mangafire-ptbr",
                  "signingKeyFingerprint": fingerprint,
              }
          }
          (out / "repo.json").write_text(json.dumps(repo, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          index_path = out / "index.json"
          min_path = out / "index.min.json"
          src = index_path if index_path.exists() else min_path
          entries = json.loads(src.read_text(encoding="utf-8"))
          for entry in entries:
              entry.setdefault("nsfw", 1)
          index_path.write_text(json.dumps(entries, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          min_path.write_text(json.dumps(entries, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")
          PY

          cp -f modules/mangafire-ptbr/icon.png tachimanga/icon/eu.kanade.tachiyomi.extension.all.mangafireptbr.png
          cp -f modules/mangafire-ptbr/icon.png tachimanga/icon/eu.kanade.tachiyomi.extension.all.mangadexptbr.png
          cp -f modules/mangafire-ptbr/icon.png tachimanga/icon/eu.kanade.tachiyomi.extension.all.niaddptbr.png
          cp -f modules/mangafire-ptbr/icon.png tachimanga/icon/eu.kanade.tachiyomi.extension.pt.noxmangaptbr.png
          cp -f modules/mangafire-ptbr/icon.png tachimanga/icon/eu.kanade.tachiyomi.extension.pt.taiyoptbr.png

      - name: Commit repository metadata
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Repository metadata already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tachimanga/repo.json tachimanga/index.json tachimanga/index.min.json tachimanga/apk tachimanga/icon
          git commit -m "Fix Tachimanga repository metadata"
          git push
