name: Publish clean Tachimanga repository

on:
  push:
    paths:
      - ".github/workflows/publish-tachimanga-repo.yml"
      - "tachimanga/*.jar"
      - "tachimanga/index.json"
      - "tachimanga/index.min.json"
      - "tachimanga/repo.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build clean repo layout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf repo
          mkdir -p repo/apk repo/icon

          cp -f tachimanga/index.json repo/index.json
          cp -f tachimanga/index.min.json repo/index.min.json

          for jar in tachimanga/*-Tachimanga.jar; do
            [ -f "$jar" ] || continue
            cp -f "$jar" "repo/apk/$(basename "$jar")"
          done

          fingerprint="$(keytool -printcert -jarfile tachimanga/MangaFire-PT-BR-Tachimanga.jar | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$fingerprint"

          python3 - "$fingerprint" <<'PY'
          import json
          import sys
          from pathlib import Path

          fingerprint = sys.argv[1]
          repo = Path("repo")

          meta = {
              "meta": {
                  "name": "Manga PT-BR Sources",
                  "shortName": "PT-BR",
                  "website": "https://github.com/IceyEternal/synthetiq-mangafire-ptbr",
                  "signingKeyFingerprint": fingerprint,
              }
          }
          (repo / "repo.json").write_text(json.dumps(meta, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          for file_name in ("index.json", "index.min.json"):
              path = repo / file_name
              entries = json.loads(path.read_text(encoding="utf-8"))
              for entry in entries:
                  entry["nsfw"] = int(entry.get("nsfw", 0))
                  for source in entry.get("sources", []):
                      source.pop("versionId", None)
              if file_name == "index.min.json":
                  text = json.dumps(entries, ensure_ascii=False, separators=(",", ":")) + "\n"
              else:
                  text = json.dumps(entries, ensure_ascii=False, indent=2) + "\n"
              path.write_text(text, encoding="utf-8")
          PY

          cp -f modules/mangafire-ptbr/icon.png repo/icon/eu.kanade.tachiyomi.extension.all.mangafireptbr.png
          cp -f modules/mangafire-ptbr/icon.png repo/icon/eu.kanade.tachiyomi.extension.all.mangadexptbr.png
          cp -f modules/mangafire-ptbr/icon.png repo/icon/eu.kanade.tachiyomi.extension.all.niaddptbr.png
          cp -f modules/mangafire-ptbr/icon.png repo/icon/eu.kanade.tachiyomi.extension.pt.noxmangaptbr.png
          cp -f modules/mangafire-ptbr/icon.png repo/icon/eu.kanade.tachiyomi.extension.pt.taiyoptbr.png

          echo "Fingerprint: $fingerprint"
          cat repo/repo.json
          python3 -m json.tool repo/repo.json >/dev/null
          python3 -m json.tool repo/index.min.json >/dev/null

      - name: Commit clean repo
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all repo)" ]; then
            echo "Already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo
          git commit -m "Publish clean Tachimanga repository"
          git push
