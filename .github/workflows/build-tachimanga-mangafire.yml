name: Build MangaFire PT-BR for Tachimanga

on:
  push:
    paths:
      - ".github/workflows/build-tachimanga-mangafire.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Clone current Keiyoushi extension source
        run: git clone --depth 1 https://github.com/keiyoushi/extensions-source.git upstream

      - name: Patch MangaFire for Tachimanga and PT-BR
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("upstream")

          # Tachimanga explicitly recommends minSdk 21 for manually built extensions.
          versions = root / "gradle/kei.versions.toml"
          text = versions.read_text()
          text = text.replace('android-sdk-min = "26"', 'android-sdk-min = "21"')
          versions.write_text(text)

          # Only configure the MangaFire module so CI does not load every extension.
          settings = root / "settings.gradle.kts"
          text = settings.read_text()
          old = 'loadAllIndividualExtensions()\n// loadIndividualExtension("all", "mangadex")'
          new = '// loadAllIndividualExtensions()\nloadIndividualExtension("all", "mangafire")'
          if old not in text:
              raise SystemExit("Could not patch settings.gradle.kts")
          settings.write_text(text.replace(old, new, 1))

          # Make this a separate PT-BR-only package, so it can coexist with the official build.
          build = root / "src/all/mangafire/build.gradle.kts"
          text = build.read_text()
          text = text.replace('name = "MangaFire"', 'name = "MangaFire PT-BR"', 1)
          text = text.replace('versionCode = 32', 'versionCode = 3201', 1)
          text = text.replace('contentWarning = ContentWarning.MIXED', 'pkgName = "all.mangafireptbr"\n    contentWarning = ContentWarning.MIXED', 1)
          text = text.replace('listOf("en", "es", "es-419", "fr", "ja", "pt", "pt-BR").forEach {', 'listOf("pt-BR").forEach {', 1)
          build.write_text(text)

          # Guarantee that the standalone extension JAR's ProGuard pass does not optimize bytecode.
          task = root / "gradle/build-logic/src/main/kotlin/io/github/keiyoushi/gradle/tasks/CreateExtensionJarTask.kt"
          text = task.read_text()
          marker = '            // make it forgiving like r8\n            sanitizedRules.add("-dontwarn **")'
          replacement = '            // Tachimanga compatibility: keep shrinking/obfuscation, but disable bytecode optimization.\n            sanitizedRules.add("-dontoptimize")\n            // make it forgiving like r8\n            sanitizedRules.add("-dontwarn **")'
          if marker not in text:
              raise SystemExit("Could not patch CreateExtensionJarTask.kt")
          task.write_text(text.replace(marker, replacement, 1))
          PY

          # Also disable R8/ProGuard optimization in the Android release configuration itself.
          if ! grep -qxF -- '-dontoptimize' upstream/common/proguard-rules.pro; then
            printf '\n-dontoptimize\n' >> upstream/common/proguard-rules.pro
          fi

      - name: Build MangaFire PT-BR extension JAR
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :src:all:mangafire:assembleRelease --no-daemon --stacktrace

      - name: Publish Tachimanga JAR into this repository
        shell: bash
        run: |
          JAR="$(find upstream/src/all/mangafire/build/outputs/jar/release -type f -name '*.jar' | head -n 1)"
          if [ -z "$JAR" ] || [ ! -f "$JAR" ]; then
            echo "Built JAR not found"
            exit 1
          fi

          mkdir -p tachimanga
          cp "$JAR" tachimanga/MangaFire-PT-BR-Tachimanga.jar
          sha256sum tachimanga/MangaFire-PT-BR-Tachimanga.jar > tachimanga/MangaFire-PT-BR-Tachimanga.jar.sha256

          cat > tachimanga/README.md <<'EOF'
          # MangaFire PT-BR para Tachimanga

          Build baseada na extensão MangaFire atual da Keiyoushi, recompilada especificamente para compatibilidade com Tachimanga:

          - apenas fonte `pt-BR`;
          - `minSdk = 21`;
          - otimização ProGuard/R8 desativada (`-dontoptimize`);
          - package próprio `all.mangafireptbr`, para não colidir com a extensão oficial.

          Instala no Tachimanga através de Browser → Extensions → + e escolhe `MangaFire-PT-BR-Tachimanga.jar`.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tachimanga/
          git commit -m "Add Tachimanga-compatible MangaFire PT-BR jar" || exit 0
          git push
