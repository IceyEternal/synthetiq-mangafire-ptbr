name: Build PT-BR manga sources

on:
  push:
    paths:
      - ".github/workflows/build-tachimanga-mangafire.yml"
      - "modules/**/index.js"
      - "modules/**/manifest.json"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: ptbr-manga-source-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Clone current Keiyoushi source
        run: git clone --depth 1 https://github.com/keiyoushi/extensions-source.git upstream

      - name: Detect Keiyoushi changes
        id: upstream
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          repo = Path("upstream")
          state_path = Path("tachimanga/upstream-state.json")

          def tree(path):
              return subprocess.check_output(
                  ["git", "-C", str(repo), "rev-parse", f"HEAD:{path}"],
                  text=True,
              ).strip()

          current = {
              "mangafire": tree("src/all/mangafire"),
              "mangadex": tree("src/all/mangadex"),
              "niadd": tree("src/all/niadd"),
              "noxmanga": tree("src/pt/remangas"),
              "gradle": tree("gradle"),
              "common": tree("common"),
              "core": tree("core"),
              "compiler": tree("compiler"),
              "i18n": tree("lib/i18n"),
          }

          previous = {}
          if state_path.exists():
              try:
                  previous = json.loads(state_path.read_text(encoding="utf-8")).get("trees", {})
              except Exception:
                  previous = {}

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          needs_build = event == "workflow_dispatch" or current != previous

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"needs_build={'true' if needs_build else 'false'}\n")

          Path(".upstream-state.json").write_text(
              json.dumps({"trees": current}, indent=2) + "\n",
              encoding="utf-8",
          )
          print("Keiyoushi changed:", needs_build)
          PY
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Patch Keiyoushi for Tachimanga PT-BR
        if: steps.upstream.outputs.needs_build == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("upstream")

          versions = root / "gradle/kei.versions.toml"
          text = versions.read_text(encoding="utf-8")
          text = re.sub(r'android-sdk-min\s*=\s*"\d+"', 'android-sdk-min = "21"', text, count=1)
          versions.write_text(text, encoding="utf-8")

          settings = root / "settings.gradle.kts"
          text = settings.read_text(encoding="utf-8")
          text = text.replace("loadAllIndividualExtensions()", "// loadAllIndividualExtensions()", 1)
          marker = '// loadIndividualExtension("all", "mangadex")'
          replacement = '\n'.join([
              'loadIndividualExtension("all", "mangafire")',
              'loadIndividualExtension("all", "mangadex")',
              'loadIndividualExtension("all", "niadd")',
              'loadIndividualExtension("pt", "remangas")',
          ])
          if marker in text:
              text = text.replace(marker, replacement, 1)
          else:
              anchor = "// loadAllIndividualExtensions()"
              text = text.replace(anchor, anchor + "\n" + replacement, 1)
          settings.write_text(text, encoding="utf-8")

          def identity(path, old_name, new_name, pkg):
              text = path.read_text(encoding="utf-8")
              text = text.replace(f'name = "{old_name}"', f'name = "{new_name}"', 1)
              if "pkgName =" not in text:
                  text = text.replace(f'name = "{new_name}"', f'name = "{new_name}"\n    pkgName = "{pkg}"', 1)
              return text

          path = root / "src/all/mangafire/build.gradle.kts"
          text = identity(path, "MangaFire", "MangaFire PT-BR", "all.mangafireptbr")
          start = text.find("    listOf(")
          end = text.find("    deeplink {", start)
          if start == -1 or end == -1:
              raise SystemExit("Could not isolate MangaFire language block")
          source = '    source {\n        lang = "pt-BR"\n        baseUrl = "https://mangafire.to"\n    }\n\n'
          path.write_text(text[:start] + source + text[end:], encoding="utf-8")

          path = root / "src/all/mangadex/build.gradle.kts"
          text = identity(path, "MangaDex", "MangaDex PT-BR", "all.mangadexptbr")
          start = text.find("    listOf(")
          end = text.find("    deeplink {", start)
          if start == -1 or end == -1:
              raise SystemExit("Could not isolate MangaDex language block")
          source = '    source {\n        lang = "pt-BR"\n        baseUrl = "https://mangadex.org"\n    }\n\n'
          path.write_text(text[:start] + source + text[end:], encoding="utf-8")

          path = root / "src/all/niadd/build.gradle.kts"
          text = identity(path, "Niadd", "Niadd PT-BR", "all.niaddptbr")
          start = text.find("    val subdomains = mapOf(")
          end = text.rfind("\n}")
          if start == -1 or end == -1:
              raise SystemExit("Could not isolate Niadd language block")
          source = '    source {\n        lang = "pt-BR"\n        baseUrl = "https://br.niadd.com"\n    }'
          path.write_text(text[:start] + source + text[end:], encoding="utf-8")

          path = root / "src/pt/remangas/build.gradle.kts"
          text = identity(path, "NoxManga", "NoxManga PT-BR", "pt.noxmangaptbr")
          path.write_text(text, encoding="utf-8")

          task = root / "gradle/build-logic/src/main/kotlin/io/github/keiyoushi/gradle/tasks/CreateExtensionJarTask.kt"
          text = task.read_text(encoding="utf-8")
          marker = '            // make it forgiving like r8\n            sanitizedRules.add("-dontwarn **")'
          replacement = '            // Tachimanga compatibility: disable bytecode optimisation.\n            sanitizedRules.add("-dontoptimize")\n            // make it forgiving like r8\n            sanitizedRules.add("-dontwarn **")'
          if marker in text:
              text = text.replace(marker, replacement, 1)
          elif 'sanitizedRules.add("-dontoptimize")' not in text:
              raise SystemExit("Could not patch standalone JAR ProGuard rules")
          task.write_text(text, encoding="utf-8")
          PY

          if ! grep -qxF -- '-dontoptimize' upstream/common/proguard-rules.pro; then
            printf '\n-dontoptimize\n' >> upstream/common/proguard-rules.pro
          fi

      - name: Build Tachimanga JARs
        if: steps.upstream.outputs.needs_build == 'true'
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew \
            :src:all:mangafire:assembleRelease \
            :src:all:mangadex:assembleRelease \
            :src:all:niadd:assembleRelease \
            :src:pt:remangas:assembleRelease \
            --no-daemon --stacktrace

      - name: Publish Tachimanga JARs
        if: steps.upstream.outputs.needs_build == 'true'
        shell: bash
        run: |
          mkdir -p tachimanga

          copy_jar() {
            category="$1"
            module="$2"
            output="$3"
            jar="$(find "upstream/src/$category/$module/build/outputs/jar/release" -type f -name '*.jar' | head -n 1)"
            if [ -z "$jar" ] || [ ! -f "$jar" ]; then
              echo "Built JAR not found for $category/$module"
              exit 1
            fi
            cp "$jar" "tachimanga/$output"
            sha256sum "tachimanga/$output" > "tachimanga/$output.sha256"
          }

          copy_jar all mangafire MangaFire-PT-BR-Tachimanga.jar
          copy_jar all mangadex MangaDex-PT-BR-Tachimanga.jar
          copy_jar all niadd Niadd-PT-BR-Tachimanga.jar
          copy_jar pt remangas NoxManga-PT-BR-Tachimanga.jar
          cp .upstream-state.json tachimanga/upstream-state.json

          cat > tachimanga/README.md <<'EOF'
          # Fontes PT-BR para Tachimanga

          Builds baseadas nas extensões atuais da Keiyoushi e recompiladas para Tachimanga:

          - MangaFire PT-BR — principal;
          - MangaDex PT-BR — backup;
          - Niadd PT-BR — backup adicional;
          - NoxManga PT-BR — backup adicional.

          Todas usam `minSdk = 21`, têm a otimização ProGuard/R8 desativada (`-dontoptimize`) e packages próprios para não colidirem com builds oficiais.

          Este workflow verifica a Keiyoushi automaticamente de 6 em 6 horas. Quando o código upstream muda, recompila as quatro extensões e substitui os JARs deste diretório.
          EOF

      - name: Prepare Synthetiq sources and hashes
        shell: bash
        run: |
          mkdir -p modules/mangadex-ptbr modules/taiyo-ptbr
          cp -f modules/mangafire-ptbr/icon.png modules/mangadex-ptbr/icon.png
          cp -f modules/mangafire-ptbr/icon.png modules/taiyo-ptbr/icon.png

          node --check modules/mangafire-ptbr/index.js
          node --check modules/mangadex-ptbr/index.js
          node --check modules/taiyo-ptbr/index.js

          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib
          import json

          modules = [
              ("mangafire-ptbr", 1),
              ("mangadex-ptbr", 2),
              ("taiyo-ptbr", 3),
          ]

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def bump_patch(version: str) -> str:
              parts = str(version or "1.0.0").split(".")
              while len(parts) < 3:
                  parts.append("0")
              try:
                  parts[2] = str(int(parts[2]) + 1)
              except ValueError:
                  return "1.0.1"
              return ".".join(parts[:3])

          index_modules = []
          changed_module_metadata = False

          for folder, priority in modules:
              base = Path("modules") / folder
              entry_path = base / "index.js"
              manifest_path = base / "manifest.json"
              icon_path = base / "icon.png"
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

              old_entry_hash = str(manifest.get("entry", {}).get("sha256", ""))
              new_entry_hash = sha256(entry_path)
              if old_entry_hash not in ("", "PLACEHOLDER", new_entry_hash):
                  manifest["version"] = bump_patch(manifest.get("version", "1.0.0"))
                  changed_module_metadata = True

              manifest["entry"]["sha256"] = new_entry_hash
              manifest["icon"]["sha256"] = sha256(icon_path)
              manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

              index_modules.append({
                  "contentRating": manifest["contentRating"],
                  "contentType": manifest["contentType"],
                  "familyID": manifest["familyID"],
                  "icon": manifest["icon"],
                  "id": manifest["id"],
                  "language": manifest["language"],
                  "manifest": {
                      "path": str(manifest_path).replace("\\", "/"),
                      "sha256": sha256(manifest_path),
                  },
                  "name": manifest["name"],
                  "releaseTrack": manifest["releaseTrack"],
                  "status": manifest["status"],
                  "version": manifest["version"],
                  "sortPriority": priority,
              })

          index_path = Path("index.json")
          old_index = {}
          if index_path.exists():
              try:
                  old_index = json.loads(index_path.read_text(encoding="utf-8"))
              except Exception:
                  old_index = {}

          generated_at = old_index.get("generatedAt", "2026-08-29T00:00:00Z")
          if old_index.get("modules") != index_modules or changed_module_metadata:
              generated_at = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")

          index = {
              "schemaVersion": 1,
              "generatedAt": generated_at,
              "repository": {
                  "id": "iceyeternal.mangafire.ptbr",
                  "name": "Manga PT-BR Sources",
                  "owner": "IceyEternal",
                  "homepage": "https://github.com/IceyEternal/synthetiq-mangafire-ptbr",
                  "universalLink": "https://github.com/IceyEternal/synthetiq-mangafire-ptbr",
              },
              "modules": index_modules,
          }
          index_path.write_text(json.dumps(index, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Update repository README
        shell: bash
        run: |
          cat > README.md <<'EOF'
          # Manga PT-BR Sources

          Repositório pessoal de fontes PT-BR para Synthetiq Books e builds compatíveis com Tachimanga.

          ## Synthetiq Books

          Adiciona este repositório na app:

          `https://github.com/IceyEternal/synthetiq-mangafire-ptbr`

          Fontes incluídas:

          - MangaFire PT-BR — principal
          - MangaDex PT-BR — backup
          - Taiyō PT-BR — segundo backup

          ## Tachimanga

          Os JARs prontos a instalar estão na pasta `tachimanga/`:

          - MangaFire PT-BR
          - MangaDex PT-BR
          - Niadd PT-BR
          - NoxManga PT-BR

          A GitHub Action verifica alterações na Keiyoushi de 6 em 6 horas e recompila automaticamente as quatro extensões quando o upstream muda.
          EOF

      - name: Commit generated files
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Everything is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.json modules/ tachimanga/
          git commit -m "Sync PT-BR manga sources"
          git push