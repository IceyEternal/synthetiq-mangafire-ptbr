name: Update Synthetiq hashes

on:
  push:
    paths:
      - '.github/workflows/update-synthetiq-hashes.yml'

permissions:
  contents: write

jobs:
  update-hashes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update SHA-256 hashes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          module_path = Path('modules/mangafire-ptbr/index.js')
          manifest_path = Path('modules/mangafire-ptbr/manifest.json')
          index_path = Path('index.json')

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['entry']['sha256'] = sha256(module_path)
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )

          index = json.loads(index_path.read_text(encoding='utf-8'))
          index['modules'][0]['manifest']['sha256'] = sha256(manifest_path)
          index_path.write_text(
              json.dumps(index, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )

          print('index.js:', sha256(module_path))
          print('manifest.json:', sha256(manifest_path))
          PY

      - name: Commit updated hashes
        run: |
          if git diff --quiet; then
            echo "Hashes already correct."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/mangafire-ptbr/manifest.json index.json
          git commit -m "Update Synthetiq hashes"
          git push
